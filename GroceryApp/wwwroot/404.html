<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Grocery App</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
        /* Shown for the fraction of a second before the redirect to index.html. */
        body {
            align-items: center;
            background-color: #f4f5f7;
            color: #4a5464;
            display: flex;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 0.9375rem;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        @media (prefers-color-scheme: dark) {
            body { background-color: #0b0f19; color: #a7b0c0; }
        }
    </style>
    <script>
        // Static hosting has no rewrite rules, so GitHub Pages answers any unknown path with this
        // file (HTTP 404). That is expected for client side routes such as /groceries/edit/3.
        // The route is appended to the query string, then the browser is sent back to index.html
        // where the URL is restored and handed to the Blazor router.
        // segmentCount is 0 because the app is served from the root of blazor.pattygcoding.com.
        (function () {
            var segmentCount = 0;
            var location = window.location;
            var basePath = location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/';
            var route = location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~');
            var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';

            location.replace(
                location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
                basePath + route + query + location.hash);
        })();
    </script>
</head>

<body>
    <p>Redirecting…</p>
</body>

</html>
