<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery App - Blazor WebAssembly</title>
    <meta name="description" content="A personal Blazor WebAssembly project: a grocery catalogue with client side CRUD, localStorage persistence and Excel reports generated in C#." />
    <meta name="color-scheme" content="light dark" />
    <script>
        // Resolve the theme before first paint so a dark preference never flashes light.
        // The theme control writes the same key ("light", "dark", or absent meaning "system").
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('groceryapp.theme'); } catch (e) { }
            var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
            var theme = preference === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : preference;
            var root = document.documentElement;
            root.setAttribute('data-theme', theme);
            root.setAttribute('data-theme-preference', preference);
        })();
    </script>
    <base href="/" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
        // GitHub Pages serves 404.html for any path it does not have a file for, which is how
        // deep links and refreshes on client side routes (/groceries, /reports, ...) work.
        // 404.html forwards the requested route here in the query string; this restores the
        // real URL before the Blazor router starts.
        (function () {
            var location = window.location;
            if (location.search[1] === '/') {
                var decoded = location.search.slice(1).split('&').map(function (part) {
                    return part.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, document.title, location.pathname.slice(0, -1) + decoded + location.hash);
            }
        })();
    </script>
    <style>
        /* First paint, before Blazor takes over. Kept inline so it renders without waiting
           for app.css, and themed with prefers-color-scheme to avoid a brightness jump. */
        .boot {
            align-items: center;
            color: #4a5464;
            display: flex;
            flex-direction: column;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            gap: 0.6rem;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
        }

        .boot__mark {
            align-items: center;
            background-color: #4338ca;
            border-radius: 10px;
            color: #ffffff;
            display: flex;
            height: 44px;
            justify-content: center;
            width: 44px;
        }

        .boot__title {
            color: #101828;
            font-size: 1.0625rem;
            font-weight: 600;
            margin: 0;
        }

        .boot__note {
            font-size: 0.875rem;
            margin: 0;
        }

        .boot__bar {
            animation: boot-progress 1.2s ease-in-out infinite;
            background-color: #4338ca;
            border-radius: 999px;
            height: 3px;
            margin-top: 0.4rem;
            width: 96px;
        }

        @keyframes boot-progress {
            0%, 100% { opacity: 0.3; transform: scaleX(0.35); }
            50% { opacity: 1; transform: scaleX(1); }
        }

        /* The theme attribute is set by the inline script above, so the first paint already matches
           the resolved theme (explicit choice or the system setting). */
        html[data-theme="dark"] .boot { color: #a7b0c0; }
        html[data-theme="dark"] .boot__mark { background-color: #a5b0ff; color: #0b0f19; }
        html[data-theme="dark"] .boot__title { color: #eef1f6; }
        html[data-theme="dark"] .boot__bar { background-color: #a5b0ff; }

        @media (prefers-reduced-motion: reduce) {
            .boot__bar { animation: none; opacity: 0.6; transform: none; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="boot__mark">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                    <use href="icons.svg#i-basket3-fill"></use>
                </svg>
            </span>
            <p class="boot__title">Grocery App</p>
            <p class="boot__note">Starting Blazor WebAssembly…</p>
            <span class="boot__bar" aria-hidden="true"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload the app</a>
        <button type="button" class="dismiss" aria-label="Dismiss error message">
            <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                <use href="icons.svg#i-x-lg"></use>
            </svg>
        </button>
    </div>
    <script src="theme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="sortable-table.js"></script>
    <script src="file-download.js"></script>
</body>

</html>
